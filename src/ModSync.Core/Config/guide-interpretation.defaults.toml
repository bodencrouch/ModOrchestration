'''

[[instruction]]
id = "nlp_054_patcher"
action = "Patcher"
options = "IgnoreCase"
pattern = '''
(?:when\s+)?installing,?\s+(?:select|use|choose)\s+(?<option>.+?)(?:\.(?=\s|$)|;|$)
'''

[[instruction]]
id = "nlp_055_patcher"
action = "Patcher"
options = "IgnoreCase"
pattern = '''
re-run\s+the\s+(?:patcher|installer)(?:\s+and)?\s+(?:select|install)?\s*(?<option>.*?)(?:\.(?=\s|$)|$|,\s+if)
'''

[[instruction]]
id = "nlp_056_patcher"
action = "Patcher"
options = "IgnoreCase"
pattern = '''
(?:use|apply)\s+the\s+tslpatcher(?:\s+installer\s+method)?
'''

[[instruction]]
id = "nlp_057_execute"
action = "Execute"
options = "IgnoreCase"
pattern = '''
place\s+(?<source>[\w\s\-_.]+?)\s+in\s+(?:your\s+)?(?<destination>[\w\s\-_/\\]+?)(?:,\s+|\s+and\s+)run\s+(?:it|the\s+file)
'''

[[instruction]]
id = "nlp_058_execute"
action = "Execute"
options = "IgnoreCase | Singleline"
pattern = '''
download\s+(?:one\s+of\s+)?(?:the\s+)?(?<source>[\w\s\-_.]+?).*?(?:run|execute)\s+(?:the\s+)?(?:executable|file)
'''

[[instruction]]
id = "nlp_059_delduplicate"
action = "DelDuplicate"
options = "IgnoreCase"
pattern = '''
place\s+(?<source>DelDuplicateTGA-TPC|bash\s+script\s+version)\s+in\s+your\s+main\s+game\s+folder
'''

[[instruction]]
id = "nlp_060_delduplicate"
action = "DelDuplicate"
options = "IgnoreCase"
pattern = '''
say\s+that\s+\*\*(?<extension>TPC|TGA)\s+should\s+be\s+deleted\*\*
'''

[[instruction]]
id = "nlp_061_delduplicate"
action = "DelDuplicate"
options = "IgnoreCase"
pattern = '''
run\s+it,?\s+say\s+that\s+(?<extension>TPC|TGA)\s+should\s+be\s+deleted
'''

[[recommendation]]
id = "rec_001"
pattern = '''
(?:I\s+)?(?:recommend|suggest|advise)\s+(?:the\s+)?(?<option>[^.,;]+?)(?:\s+version|\s+option|\s+install)?(?:[.,;]|$)
'''

[[recommendation]]
id = "rec_002"
pattern = '''
(?:I\s+)?(?:strongly\s+)?recommend\s+(?:using\s+)?(?:the\s+)?(?<option>[^.,;]+?)
'''

[[recommendation]]
id = "rec_003"
pattern = '''
(?:your\s+)?(?:choice|preference)(?:\s+(?:of\s+which|whether))?
'''

[[recommendation]]
id = "rec_004"
pattern = '''
(?:download|use|choose|select)\s+(?:the\s+)?(?<option>[^.,;]+?)\s+(?:version|option|variant|file|edition)
'''

[entities]

[entities.file_range]
options = "IgnoreCase"
pattern = '''
["']?(?<start>[\w\-_]+\.[\w]+)["']?\s+(?:through|to|-)\s+["']?(?<end>[\w\-_]+\.[\w]+)["']?
'''

[entities.numeric_range]
options = "IgnoreCase"
pattern = '''
(?<prefix>[\w\-_]+?)(?<start_num>\d+)(?<suffix>[\w\-_.]*?)\s+through\s+\k<prefix>(?<end_num>\d+)(?:\k<suffix>|\.[\w]+)
'''

[entities.file_list]
options = "IgnoreCase"
pattern = '''
(?<files>(?:[\w\-_.]+\.[\w]+(?:\s+&\s+\.[\w]+)?(?:,\s*|\s+and\s+|\s+&\s+))+[\w\-_.]+\.[\w]+)
'''

[entities.single_file]
options = "IgnoreCase"
pattern = '''
["']?(?<file>[\w\-_]+\.[\w]{2,4})["']?
'''

[entities.folder_from]
options = "IgnoreCase"
pattern = '''
from\s+(?:the\s+)?(?:both\s+the\s+)?(?:[\w\-]+(?:'s|’s)\s+)?(?<folder>[\w\s\-_&/\\]+?)\s+(?:and\s+(?<folder2>[\w\s\-_/\\]+?)\s+)?(?:folder|directory)
'''

[entities.folder_name]
options = "IgnoreCase"
pattern = '''
(?:the\s+)?["']?(?<folder>[\w\s\-_/\\]+?)["']?\s+folder
'''

[entities.prefix_filter]
options = "IgnoreCase"
pattern = '''
(?:beginning|starting)(?:\s+with)?\s+(?<prefixes>(?:["']?[\w\-]+["']?(?:,\s*|\s+and\s+|\s+&\s+))+["']?[\w\-]+["']?)
'''

[entities.override_dest]
options = "IgnoreCase"
pattern = '''
(?:to\s+)?(?:your\s+)?(?:game'?s?\s+)?override(?:\s+(?:folder|directory))?
'''

[entities.main_dir_dest]
options = "IgnoreCase"
pattern = '''
(?:to\s+)?(?:the\s+)?main\s+(?:game\s+)?(?:directory|folder)
'''

[entities.movies_dest]
options = "IgnoreCase"
pattern = '''
(?:to\s+)?(?:your\s+)?(?:game'?s?\s+)?movies\s+folder
'''

[entities.wildcard]
options = "IgnoreCase"
pattern = '''
(?<pattern>[\w\-_*?]+\*[\w\-_*?]*)
'''

[entities.except]
options = "IgnoreCase | RegexOptions"
pattern = '''
(?:except|excluding|but\s+not|not\s+including)(?:\s+(?:for|the))?\s+(?:the\s+)?(?<exceptions>.+?)(?:\s*(?:\(|:|;|\.(?=\s|$)|$))
'''

[entities.ignore]
options = "IgnoreCase"
pattern = '''
(?:ignore|skip|don't\s+(?:install|move|use))\s+(?:the\s+)?(?<ignore>.+?)(?:\.(?=\s|$)|;|,\s+you|\s+unless|$)
'''

[entities.overwrite]
options = "IgnoreCase"
pattern = '''
(?:overwrite|replace)(?:\s+when\s+prompted|\s+if\s+(?:asked|prompted))?
'''

[entities.no_overwrite]
options = "IgnoreCase"
pattern = '''
(?:do\s+not|don't)\s+overwrite
'''

[entities.file_types]
options = "IgnoreCase"
pattern = '''
(?<types>(?:\.[\w]+(?:\s+&\s+|,\s*|\s+and\s+))+\.[\w]+)
'''

[destinations]
"override" = '<<kotorDirectory>>\Override'
"override folder" = '<<kotorDirectory>>\Override'
"override directory" = '<<kotorDirectory>>\Override'
"game's override" = '<<kotorDirectory>>\Override'
"your override" = '<<kotorDirectory>>\Override'
"main game directory" = "<<kotorDirectory>>"
"main directory" = "<<kotorDirectory>>"
"game directory" = "<<kotorDirectory>>"
"movies folder" = '<<kotorDirectory>>\Movies'
"movies" = '<<kotorDirectory>>\Movies'
"your movies folder" = '<<kotorDirectory>>\Movies'

